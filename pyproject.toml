[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth2agent"
version = "0.2.0"
description = "Standalone ChatGPT/Codex OAuth to Codex Agent Identity converter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "cryptography>=42.0.0",
  "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/feng123-new/oauth2agent"
Repository = "https://github.com/feng123-new/oauth2agent"
Issues = "https://github.com/feng123-new/oauth2agent/issues"

[project.scripts]
oauth2agent = "oauth2agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oauth2agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
